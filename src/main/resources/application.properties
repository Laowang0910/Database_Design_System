# Spring Boot 应用名称
spring.application.name=hospital-back

# MySQL 数据库连接配置
# 数据库驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 数据库连接 URL，请根据您的实际情况修改数据库名、主机、端口等
spring.datasource.url=jdbc:mysql://localhost:3306/ward%20management?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
# 数据库用户名
spring.datasource.username=root
# 数据库密码
spring.datasource.password=040905

# MyBatis 配置
# Mapper XML 文件位置，用于存放 SQL 映射文件
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类包路径，用于指定实体类所在的包
mybatis.type-aliases-package=com.example.hospital.entity
# 开启驼峰命名自动转换，将数据库中的下划线命名自动转换为 Java 中的驼峰命名
mybatis.configuration.map-underscore-to-camel-case=true

# 日志配置
logging.level.org.springframework=INFO
logging.level.com.example.hospital=DEBUG

# 服务器端口配置
server.port=8080
